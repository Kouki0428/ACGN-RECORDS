name: Release

# 推送 v* 标签时自动构建并发布：
#   git tag v0.1.4 && git push origin v0.1.4
# 产出：NSIS setup.exe（winCodeSign 符号链接在 runner 管理员特权下可正常解压）
#       + latest.yml（electron-updater 更新源）+ 便携 zip
#
# 发布流程：electron-builder 以 draft 创建 Release 并上传安装包 → 追加便携 zip →
# 最后一步把 draft 转正。（不能先用 gh 建正式 Release：electron-builder 检测到
# existing type=release 与其 draft 发布方式不兼容会跳过上传安装包）

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (postinstall 会重编 better-sqlite3)
        run: npm ci

      - name: Build renderer & main & preload
        run: npm run build

      # electron-builder 自动以 draft 创建 Release，上传 setup.exe / latest.yml / blockmap
      - name: Package Windows (NSIS, publish to GitHub Release)
        run: npx electron-builder --config build/electron-builder.yml --win --publish always --config.npmRebuild=true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Make portable zip
        shell: pwsh
        run: Compress-Archive -Path 'release/win-unpacked/*' -DestinationPath "release/Bangumi-$($env:GITHUB_REF_NAME)-portable-win.zip" -Force

      - name: Upload portable zip to the release
        run: |
          gh release upload ${{ github.ref_name }} "release/Bangumi-$($env:GITHUB_REF_NAME)-portable-win.zip" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release (draft → latest, or prerelease for beta)
        shell: pwsh
        run: |
          # draft release 在 releases/tags/{tag} 端点返回 404，必须从列表按 tag_name 取 id。
          # 注意：jq 字符串必须用双引号，单引号非法；这里用 jq 的 env.VAR 读取环境变量。
          $rel = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --jq ".[]|select(.tag_name==env.GITHUB_REF_NAME)|.id"
          if (-not $rel) { throw "release id not found for $env:GITHUB_REF_NAME" }

          # 从根 CHANGELOG.md 提取当前版本的更新说明作为 Release 正文（从 "## vX.Y.Z" 到下一个 "## " 为止）
          $notes = $null
          $clPath = "$env:GITHUB_WORKSPACE/CHANGELOG.md"
          if (Test-Path $clPath) {
            $cl = Get-Content $clPath -Raw -Encoding utf8
            $m = [regex]::Match($cl, "(?m)^## $([regex]::Escape($env:GITHUB_REF_NAME))\r?\n(.*?)(?=^## |\z)", 'Singleline')
            $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { $null }
          }

          $isBeta = $env:GITHUB_REF_NAME -match '-beta'
          $props = @{ draft = $false; name = "$env:GITHUB_REF_NAME" }
          if ($isBeta) { $props.prerelease = $true }
          if ($notes) { $props.body = $notes }
          # 用 ConvertTo-Json 构造真实布尔值 + 含换行/中文的正文，避免字符串拼接转义问题。
          # 必须用 JSON 文件体发送真实布尔值；-F 会把 false 当成字符串（非空即真），导致 draft 无法取消。
          $props | ConvertTo-Json -Depth 3 | Out-File -Encoding utf8 "$env:RUNNER_TEMP\rel.json" -NoNewline
          gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/releases/$rel" --input "$env:RUNNER_TEMP\rel.json"
          if (-not $isBeta) {
            gh release edit $env:GITHUB_REF_NAME --latest
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
