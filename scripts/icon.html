<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; }
  body { width: 1024px; height: 1024px; overflow: hidden; background: transparent; }
</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 品牌粉圆角方块背景 -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#ff5c8a"/>

  <!-- 小电视：V 形双天线（末端深入机身内，衔接自然） -->
  <line x1="31" y1="12" x2="44" y2="31" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <line x1="69" y1="12" x2="56" y2="31" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>

  <!-- 小电视：圆角矩形机身 -->
  <rect x="15" y="28" width="70" height="54" rx="15" fill="#ffffff"/>

  <!-- 小电视：双眼（品牌粉竖长圆角条） -->
  <rect x="33" y="44" width="10" height="24" rx="5" fill="#ff5c8a"/>
  <rect x="57" y="44" width="10" height="24" rx="5" fill="#ff5c8a"/>
</svg>
</body>
</html>
