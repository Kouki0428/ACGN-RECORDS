# electron-builder 配置（Windows 目标，NSIS 安装包）
appId: com.acgnrecords.app
productName: ACGN Records
copyright: Copyright © 2026

directories:
  output: release
  buildResources: resources

# 更新源：electron-updater 从 GitHub Releases 读取 latest.yml + setup.exe
publish:
  provider: github
  owner: yhq1845769
  repo: ACGN-RECORDS
# 本地手动打包不带 --publish 参数时不会真正发布；CI 里用 --publish always
releaseType: release

# 本地手动打包：复用 dev 环境已编译好的 better-sqlite3 原生模块，跳过 npm rebuild。
# 避免原生模块重编译（需 node-gyp/MSVC 工具链）以及 dev 应用运行时的文件占用（EBUSY）。
# 前提：打包前须关闭正在运行的开发版 ACGN Records（释放 node_modules/better-sqlite3 占用）。
# CI 从全新 checkout 构建时应改回 true（或用根目录 electron-builder.yml）。
npmRebuild: false

files:
  - dist
  - dist-electron

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  # 卸载默认保留 userData（收藏/进度/离线库等），避免误删数据
  deleteAppDataOnUninstall: false

# native 模块需在打包前用 electron-rebuild 重编译（见 package.json 的 rebuild:sqlite）
